[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-of-denoising"
version = "0.1.0"
description = "Per-request, drift-tolerant verification of diffusion inference on untrusted, heterogeneous hardware."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "diffusers>=0.30", "transformers>=4.44", "huggingface_hub>=0.24",
                "safetensors", "accelerate", "numpy", "pillow"]

[project.optional-dependencies]
figures = ["matplotlib"]
onnx = ["onnx", "onnxruntime", "onnxconverter-common"]

[tool.setuptools]
packages = ["podlab"]
